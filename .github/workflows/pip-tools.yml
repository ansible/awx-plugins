---

name: 🔒 pip-tools

on:
  workflow_dispatch:
    inputs:
      package-distribuition:
        # github.event_name == 'workflow_dispatch'
        # && github.event.inputs.package-distribuition
        description: >-
          A target Python package distribution to upgrade
        required: false
  pull_request:
    paths:
    - .github/workflows/pip-tools.yml
    - .github/workflows/reusable-pip-tools.yml
  schedule:
  - cron: 7 6 * * Mon  # Run every Monday at 06:07 UTC

env:
  GIT_BRANCH: >-
    maintenance/pip-tools-constraint-lockfiles${{
      (
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.package-distribuition
      )
      && format('-updating-{0}', github.event.inputs.package-distribuition)
      || ''
    }}
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_PYTHON_VERSION_WARNING: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  PY_COLORS: 1

concurrency:
  group: >-
    ${{
        github.workflow
    }}-${{
        github.event.inputs.package-distribuition
        || github.event.pull_request.number
        || github.sha
    }}
  cancel-in-progress: true

run-name: >-
  ⮸
  Bumping
  ${{
  (
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.package-distribuition
  )
  && format('`{0}`', github.event.inputs.package-distribuition)
  || 'everything'
  }}
  in all the lock files
  🔒

jobs:

  # NOTE: The lock file matrix is split into a job per OS family to stay
  # NOTE: below the limit of 256 configurations that GitHub imposes on a
  # NOTE: single job. Keep the matrices of these jobs in sync, except for
  # NOTE: the runner VMs.

  deps-linux:
    name: ⛓🔒 Lock files${{ '' }}  # nest jobs under the same sidebar category
    strategy:
      matrix:
        python-version:
        # NOTE: The latest and the lowest supported Pythons are prioritized
        # NOTE: to improve the responsiveness. It's nice to see the most
        # NOTE: important results first.
        - 3.14
        - 3.11
        - 3.12
        - 3.13
        runner-vm-os:
        - ubuntu-24.04-arm
        - ubuntu-24.04  # x86_64
        lock-file-env:
        - build-dists
        - build-docs
        - codelinter-docs
        - coverage-docs
        - doctest-docs
        - linkcheck-docs
        - metadata-validation
        - pip-compile
        - pip-compile-build-lock
        - pip-compile-tox-env-lock
        - pre-commit
        - py
        - tox
        - spellcheck-docs
        lock-file-extra-input:
        - pyproject.toml --all-extras
        - ''
        exclude:
        - lock-file-env: build-dists
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: build-docs
          lock-file-extra-input: ''
        - lock-file-env: codelinter-docs
          lock-file-extra-input: ''
        - lock-file-env: coverage-docs
          lock-file-extra-input: ''
        - lock-file-env: doctest-docs
          lock-file-extra-input: ''
        - lock-file-env: linkcheck-docs
          lock-file-extra-input: ''
        - lock-file-env: metadata-validation
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile-build-lock
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile-tox-env-lock
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pre-commit
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: py
          lock-file-extra-input: ''
        - lock-file-env: tox
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: spellcheck-docs
          lock-file-extra-input: ''

    uses: ./.github/workflows/reusable-pip-tools.yml
    with:
      lock-file-env: ${{ matrix.lock-file-env }}
      lock-file-extra-input: ${{ matrix.lock-file-extra-input }}
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ${{ matrix.runner-vm-os }}
      upgrade-package: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
          || ''
        }}

  deps-macos:
    name: ⛓🔒 Lock files${{ '' }}  # nest jobs under the same sidebar category
    strategy:
      matrix:
        python-version:
        # NOTE: The latest and the lowest supported Pythons are prioritized
        # NOTE: to improve the responsiveness. It's nice to see the most
        # NOTE: important results first.
        - 3.14
        - 3.11
        - 3.12
        - 3.13
        runner-vm-os:
        - macos-26  # arm64
        - macos-26-intel
        lock-file-env:
        - build-dists
        - build-docs
        - codelinter-docs
        - coverage-docs
        - doctest-docs
        - linkcheck-docs
        - metadata-validation
        - pip-compile
        - pip-compile-build-lock
        - pip-compile-tox-env-lock
        - pre-commit
        - py
        - tox
        - spellcheck-docs
        lock-file-extra-input:
        - pyproject.toml --all-extras
        - ''
        exclude:
        - lock-file-env: build-dists
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: build-docs
          lock-file-extra-input: ''
        - lock-file-env: codelinter-docs
          lock-file-extra-input: ''
        - lock-file-env: coverage-docs
          lock-file-extra-input: ''
        - lock-file-env: doctest-docs
          lock-file-extra-input: ''
        - lock-file-env: linkcheck-docs
          lock-file-extra-input: ''
        - lock-file-env: metadata-validation
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile-build-lock
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pip-compile-tox-env-lock
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: pre-commit
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: py
          lock-file-extra-input: ''
        - lock-file-env: tox
          lock-file-extra-input: pyproject.toml --all-extras
        - lock-file-env: spellcheck-docs
          lock-file-extra-input: ''

    uses: ./.github/workflows/reusable-pip-tools.yml
    with:
      lock-file-env: ${{ matrix.lock-file-env }}
      lock-file-extra-input: ${{ matrix.lock-file-extra-input }}
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ${{ matrix.runner-vm-os }}
      upgrade-package: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
          || ''
        }}

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
    - deps-linux
    - deps-macos

    runs-on: ubuntu-latest

    timeout-minutes: 1

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}

  publish-pr:
    name: Open/refresh a PR
    if: github.event_name != 'pull_request'

    needs:
    - check

    runs-on: Ubuntu-latest

    # NOTE: Signing makes `create-pull-request` recreate every commit via
    # NOTE: 3 throttled GitHub API calls, taking ~3s per lock file. With
    # NOTE: all the lock files updated, this adds up to ~11 minutes.
    timeout-minutes: 15

    environment:
      name: pip-tools
      url: ${{ steps.pr.outputs.pull-request-url }}

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Download all the dists
      id: artifacts-download
      continue-on-error: true  # and judge whether there's updates later
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ${{ runner.temp }}/patches/
        pattern: pip-constraints-git-patches--*
    - name: >-
        Determine whether any change suggestions to lockfiles
        have been produced
      if: steps.artifacts-download.outcome == 'success'
      id: artifacts
      run: >-
        echo "lockfile-updates-needed=true" >> "${GITHUB_OUTPUT}"
    - name: Grab the source from Git
      if: steps.artifacts.outputs.lockfile-updates-needed
      uses: actions/checkout@v4
    - name: Setup git user as [bot]
      if: steps.artifacts.outputs.lockfile-updates-needed
      # Refs:
      # * https://github.community/t/github-actions-bot-email-address/17204/6
      # * https://github.com/actions/checkout/issues/13#issuecomment-724415212
      uses: fregante/setup-git-user@v2.0.1

    - name: List Git patches
      if: steps.artifacts.outputs.lockfile-updates-needed
      run: ls -alh '${{ runner.temp }}/patches/'
    - name: Apply patches to the Git repo
      if: steps.artifacts.outputs.lockfile-updates-needed
      run: git am '${{ runner.temp }}/patches'/*.patch

    - name: Create a PR
      if: steps.artifacts.outputs.lockfile-updates-needed
      id: pr
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        base: ${{ github.event.repository.default_branch }}
        body: >-
          Automated pip-tools-managed pip constraint lockfiles update.
        branch: ${{ env.GIT_BRANCH }}
        draft: always-true
        sign-commits: true
        title: >-
          ⛓🔒 Bump transitive deps in pip-tools-managed lockfiles${{
          (
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
          )
          && format(' for {0}', github.event.inputs.package-distribuition)
          || ''
          }}
        token: ${{ github.token }}
    - name: Log the pull request details
      run: >-
        echo 'PR URL: ${{ steps.pr.outputs.pull-request-url }}'
        | tee -a "${GITHUB_STEP_SUMMARY}"

    - name: Turn the PR into a draft
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh pr ready --undo
        --repo '${{ github.repository }}'
        '${{ steps.pr.outputs.pull-request-url }}'

    - name: Instruct the maintainers to trigger CI by undrafting the PR
      if: steps.pr.outputs.pull-request-operation == 'created'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh pr comment
        --body 'Please mark the PR as ready for review to trigger PR checks.'
        --repo '${{ github.repository }}'
        '${{ steps.pr.outputs.pull-request-url }}'

...
